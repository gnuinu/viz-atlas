<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f6" />
    <style>
      html {
        background: #f2f4f6;
        color-scheme: light;
      }
      @media screen {
        html[data-theme='dark'] {
          background: #101318;
          color-scheme: dark;
        }
      }
    </style>
    <script>
      // Apply the preference before loading React or styles to avoid a light flash.
      ;(() => {
        let saved
        try {
          saved = localStorage.getItem('viz-atlas-theme')
        } catch {}
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        let savedLanguage
        try {
          savedLanguage = localStorage.getItem('viz-atlas-language')
        } catch {}
        const queryLanguage = new URLSearchParams(location.search).get('lang')
        document.documentElement.lang =
          queryLanguage === 'en' || queryLanguage === 'ko'
            ? queryLanguage
            : savedLanguage === 'en'
              ? 'en'
              : 'ko'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#101318' : '#f2f4f6'
      })()
    </script>
    <meta
      name="description"
      content="Viz Atlas — 실제값과 예측값을 탐색하는 인터랙티브 데이터 시각화 실험실. 오차, 불확실성, 설비별 성능을 비교하세요."
    />
    <title>Viz Atlas — Prediction Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
